{% load i18n %}
{% load eventurl %}
<section class="front-page numbered-spaces" id="numbered-spaces">
    <form method="post" id="numbered-spaces-form" data-asynctask
            data-asynctask-headline="{% trans "We're now trying to reserve this for you!" %}"
            action="{% eventurl event "presale:event.cart.add" %}?next_error={{ request.path|urlencode }}">
        {% csrf_token %}
        {% include "pretix_tables/fragment_rooms.html" %}
        <div class="row numbered-submit" data-numbered-submit>
            <div class="col-md-4 col-md-offset-8 col-xs-12">
                <button class="btn btn-block btn-primary btn-lg" type="submit" disabled>
                    <i class="fa fa-shopping-cart" aria-hidden="true"></i> {% trans "Add to cart" %}
                </button>
            </div>
        </div>
        <p class="text-muted numbered-hint" data-numbered-hint hidden>
            {% trans "Your selection is added together with the other products when you press “Add to cart” below." %}
        </p>
    </form>

    {% include "pretix_tables/fragment_dialog.html" %}
</section>
