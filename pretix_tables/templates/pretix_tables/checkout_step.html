{% extends "pretixpresale/event/checkout_base.html" %}
{% load i18n %}
{% load rich_text %}
{% block inner %}
    {{ intro|rich_text }}
    <form method="post" id="numbered-spaces-form">
        {% csrf_token %}
        <div class="panel panel-default cross-selling">
            <div class="panel-body numbered-spaces" id="numbered-spaces">
                {% include "pretix_tables/fragment_rooms.html" %}
            </div>
        </div>
        <div class="row checkout-button-row">
            <div class="col-md-4 col-sm-6">
                <a class="btn btn-block btn-default btn-lg" href="{{ prev_url }}">
                    {% trans "Go back" %}
                </a>
            </div>
            <div class="col-md-4 col-md-offset-4 col-sm-6">
                <button class="btn btn-block btn-primary btn-lg" type="submit">
                    {% trans "Continue" %}
                </button>
            </div>
            <div class="clearfix"></div>
        </div>
    </form>
    {% include "pretix_tables/fragment_dialog.html" %}
{% endblock %}
